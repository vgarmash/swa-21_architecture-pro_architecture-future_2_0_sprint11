# =============================================================================
# Terraform Plan Workflow
# =============================================================================
# Automatically runs terraform plan on pull requests
# =============================================================================

name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Task2Advanced/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to plan'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

# Prevent concurrent runs for the same environment
concurrency:
  group: terraform-plan-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ fromJson(github.event.inputs.environment != null && format('["{0}"]', github.event.inputs.environment) || '["dev", "stage", "prod"]') }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure Yandex Cloud credentials
        run: |
          # Save Service Account key to file
          echo "${{ secrets.YC_SA_PRIVATE_KEY }}" > /tmp/sa-key.json
          
          # Get IAM token using Service Account key
          echo "YC_TOKEN=$(yc iam create-token --service-account-key-file /tmp/sa-key.json)" >> $GITHUB_ENV
          
          # Set Object Storage credentials
          echo "AWS_ACCESS_KEY_ID=${{ secrets.YC_SA_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.private_key' /tmp/sa-key.json <<< '${{ secrets.YC_SA_PRIVATE_KEY }}')" >> $GITHUB_ENV
          
          # Clean up key file
          rm -f /tmp/sa-key.json

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: Task2Advanced/envs/${{ matrix.environment }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: Task2Advanced/envs/${{ matrix.environment }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false > plan_output.txt 2>&1 || true
          cat plan_output.txt
          
          # Extract plan summary
          echo "PLAN_SUMMARY<<EOF" >> $GITHUB_OUTPUT
          grep -E "(Plan:|No changes|Error:)" plan_output.txt || echo "No summary found" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: Task2Advanced/envs/${{ matrix.environment }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}
          YC_TOKEN: ${{ secrets.YC_TOKEN }}

      - name: Comment PR with Plan Output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('Task2Advanced/envs/${{ matrix.environment }}/plan_output.txt', 'utf8');
            
            const body = `## Terraform Plan Output - \`${{ matrix.environment }}\`
            
            <details>
            <summary>Click to expand</summary>
            
            \`\`\`terraform
            ${planOutput}
            \`\`\`
            
            </details>
            
            **Summary:** ${{ steps.plan.outputs.PLAN_SUMMARY }}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: Task2Advanced/envs/${{ matrix.environment }}/plan_output.txt
          retention-days: 30
